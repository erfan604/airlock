# Default gitleaks rules plus one narrow exception (coordinator 2026-11-03, AIR-285).
# docs/evidence/proofs.json is generated by scripts/proof-transcripts.ts and holds only sha256 hashes of source files;
# the entry for contracts/airlock-verdict/src/keys.rs reads as "key ... <hex>" to the generic-api-key rule.
[extend]
useDefault = true

[[allowlists]]
description = "sha256 manifest of the proof transcripts (no secrets, hashes only)"
targetRules = ["generic-api-key"]
paths = ['''^docs/evidence/proofs\.json$''']
