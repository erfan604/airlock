# Forked from the Shade Agent template (agent-contract/ at NearDeFi/shade-agent-template@816b75b, Apache-2.0, LICENSE and NOTICE.txt
# are copied next to this file). Changes are listed in docs/THIRD_PARTY.md.
[package]
name = "airlock-policy"
version = "0.1.0"
edition = "2024"
description = "AIRLOCK policy contract: provenance-gated signing for AI agent wallets on NEAR (fork of the Shade Agent template)"
license = "Apache-2.0"
publish = false

# For reproducible builds
repository = "https://github.com/<xxx>/<xxx>" # Replace with your repository
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
airlock-verdict = { path = "../airlock-verdict" }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
near-sdk = "=5.26.1"
# the `serde` feature of omni-transaction force-enables near-account-id 2, so keep `evm` only
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }
serde = { version = "=1.0.228", features = ["derive"] }
shade-attestation = "=0.2.0"

[dev-dependencies]
near-api = "=0.8.6"
near-api-types = "=0.8.6"
near-sandbox = "=0.3.9"
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
# verifies the shared vector signature in src/task.rs tests (the version already in Cargo.lock)
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
serde_json = "=1.0.149"
# Keccak256 for the mock-digest assertion of tests/exec_evm.rs (the version already in Cargo.lock)
sha3 = "=0.10.9"
shade-attestation = "=0.2.0"
tokio = { version = "=1.52.1", features = ["full"] }
# reads the function exports of the built wasm (tests/abi_snapshot.rs); the version is the one already in Cargo.lock
wasmparser = { version = "=0.244.0", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
