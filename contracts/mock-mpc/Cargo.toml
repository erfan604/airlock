# Mock of the Chain Signatures signer (v1.signer-prod.testnet, near/mpc 3.17.0) for sandbox tests. Test only: never deployed to any network.
[package]
name = "mock-mpc"
version = "0.1.0"
edition = "2024"
description = "Test-only mock of the MPC signer contract: the real sign interface and entry checks, modes ok, fail, garbage and yield"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.26.1"

[dev-dependencies]
near-api = "=0.8.6"
near-api-types = "=0.8.6"
near-sandbox = "=0.3.9"
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.1", features = ["full"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
